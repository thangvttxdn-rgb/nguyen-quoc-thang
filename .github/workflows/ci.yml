name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + ruff (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.11: phiên bản tối thiểu (target-version trong pyproject.toml); 3.13: bản mới.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Cài công cụ
        run: pip install -r requirements-dev.txt

      # Gồm nhóm luật bảo mật S (bandit): mật khẩu hardcode, SQL ghép chuỗi.
      - name: Lint (ruff)
        run: ruff check . --output-format=github

      - name: Kiểm thử (pytest)
        run: pytest -q --tb=short
